name: rider_map_poc
description: "A POC for Rider Map feature with Google Maps integration."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Google Maps
  google_maps_flutter: ^2.9.0
  
  # Route drawing
  flutter_polyline_points: ^1.0.0
  google_maps_routes: ^1.1.0
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Router
  go_router: ^14.6.2

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Network
  dio: ^5.7.0
  
  # Local Storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  
  # Location & Permissions
  geolocator: ^14.0.0
  permission_handler: ^12.0.0+1
  device_info_plus: ^11.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code generation for DI
  injectable_generator: ^2.6.2
  build_runner: ^2.4.13
  
  # Hive generator
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
