name: rider_map_poc
description: "A POC for Rider Map feature with Google Maps integration."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Google Maps
  google_maps_flutter: ^2.9.0
  
  # Route drawing
  flutter_polyline_points: ^2.1.0
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Router
  go_router: ^14.6.2

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Network
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code generation for DI
  injectable_generator: ^2.6.2
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
